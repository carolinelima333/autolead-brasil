# Atualiza a tabela lojas_receita (lojas de pneus abertas nos últimos 3 anos)
# com a base de CNPJ da Receita Federal, publicada uma vez por mês.
# Roda nos dias 10 e 25 e também pelo botão "Run workflow" na aba Actions do GitHub.
# Precisa do Secret SUPABASE_SERVICE_KEY (Settings → Secrets and variables → Actions).
# O repositório é público: o script só escreve contagens no log, nunca dados das lojas.
name: Atualizar lojas da Receita

on:
  schedule:
    - cron: '0 9 10,25 * *'   # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizar-receita
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Baixar a base da Receita e atualizar o Supabase
        env:
          SUPABASE_URL: https://nbigfrdezkozzwqozvlp.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/atualizar_receita.py
